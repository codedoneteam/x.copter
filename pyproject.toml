[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcopter"
version = "0.1.0"
description = "Async MAVLink copter control library"
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "fastcrc==0.3.5",
    "lxml==6.0.2",
    "pymavlink==2.4.49",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
